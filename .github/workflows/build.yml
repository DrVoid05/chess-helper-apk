name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip buildozer cython==0.29.36

      - name: Download Stockfish Android arm64
        run: |
          wget -q https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-armv8.tar -O sf.tar || true
          if [ -f sf.tar ] && [ -s sf.tar ]; then
            tar -xf sf.tar
            SF_BIN=$(find . -type f -name "stockfish*" ! -name "*.tar" | head -n 1)
            if [ -n "$SF_BIN" ]; then
              cp "$SF_BIN" ./stockfish
              chmod +x ./stockfish
            fi
          fi

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK with Buildozer
        run: (yes y || true) | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-APK
          path: bin/*.apk
