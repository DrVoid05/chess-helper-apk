name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip buildozer cython==0.29.36

      - name: Download Stockfish Android arm64
        run: |
          wget -q https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-armv8.tar -O sf.tar || true
          if [ -f sf.tar ] && [ -s sf.tar ]; then
            tar -xf sf.tar
            SF_BIN=$(find . -type f -name "stockfish*" ! -name "*.tar" | head -n 1)
            if [ -n "$SF_BIN" ]; then
              cp "$SF_BIN" ./stockfish
              chmod +x ./stockfish
            fi
          fi

      - name: Build APK with Buildozer
        run: yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-APK
          path: bin/*.apk
